name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kolos
          POSTGRES_PASSWORD: kolos_dev_password
          POSTGRES_DB: kolos_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kolos -d kolos_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: kolos
      POSTGRES_PASSWORD: kolos_dev_password
      POSTGRES_DB: kolos_identity
      POSTGRES_SSL: 'false'
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: kolos_business
      JWT_ACCESS_SECRET: ci_access_secret_key_at_least_32_chars
      JWT_REFRESH_SECRET: ci_refresh_secret_key_at_least_32_chars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: http://localhost:5173
      REFRESH_COOKIE_NAME: kolos_refresh
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      ADMIN_SEED_EMAIL: admin@example.com
      ADMIN_SEED_PASSWORD: Admin1234!
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @kolos/shared-types build
          pnpm --filter @kolos/http-client build

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Run Postgres migrations
        run: pnpm --filter @kolos/api typeorm:migrate

      - name: Seed admin user
        run: pnpm --filter @kolos/api seed:postgres

      - name: E2E tests
        run: pnpm test:e2e
