services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kolos
      POSTGRES_PASSWORD: kolos_dev_password
      POSTGRES_DB: kolos_identity
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolos -d kolos_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optionnel : stack complète locale (build). Pour le dev quotidien : `pnpm dev` + DB only.
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MONGO_URI: mongodb://mongo:27017
      RUN_SEED_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  user-web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/user-web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/v1
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
